modLoader="javafml"
loaderVersion="[1,)"
license="MIT"

[[mods]]
modId="betterxray"
version="${version}"
displayName="Better X-Ray"
authors="realrbn"
${icon_key}="assets/betterxray/icon.png"
description='''Configurable X-Ray, block highlighting and per-mob ESP with colored outlines or boxes.'''

[[mixins]]
config="betterxray.mixins.json"

[[mixins]]
config="betterxray.sodium.mixins.json"

[[dependencies.betterxray]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="CLIENT"

[[dependencies.betterxray]]
modId="minecraft"
type="required"
versionRange="[${minecraft_version}]"
ordering="NONE"
side="CLIENT"

[[dependencies.betterxray]]
modId="sodium"
type="optional"
versionRange="${sodium_range}"
ordering="NONE"
side="CLIENT"
